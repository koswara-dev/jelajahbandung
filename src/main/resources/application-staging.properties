spring.application.name=jelajahbandung-staging
server.forward-headers-strategy=framework

# Database Configuration
spring.datasource.url=jdbc:postgresql://172.17.0.2:5432/jelajahbandungdb
spring.datasource.username=postgres
spring.datasource.password=p4ssw0rd
spring.datasource.driver-class-name=org.postgresql.Driver

# Performance: HikariCP Connection Pool Tuning
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1200000
spring.datasource.hikari.connection-timeout=30000

# JPA / Hibernate Performance
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

# Disable Swagger for Staging/Production
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

# Error Handling Architecture: Disable stack traces in responses
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-binding-errors=never

# File Upload
file.upload-dir=uploads

