name: CI/CD Jelajah Bandung

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-1.0-staging

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache: "maven"

      - name: Build with Maven
        run: mvn clean package -DskipTests

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: kosdev92/jelajahbandung:1.0-staging
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy to remote server
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            # Navigate to project dir
            cd ~/jelajahbandung-staging || mkdir -p ~/jelajahbandung-staging && cd ~/jelajahbandung-staging

            # Stop and remove existing container
            docker stop jelajahbandung-staging || true
            docker rm jelajahbandung-staging || true

            # Remove old local image
            docker rmi kosdev92/jelajahbandung:1.0-staging || true

            # Pull 1.0-staging image
            docker pull kosdev92/jelajahbandung:1.0-staging

            # Run container with staging profile and updated port (8090 as configured in application.properties)
            docker run -d \
              -p 8091:8080 \
              --name jelajahbandung-staging \
              --network jc-network \
              -e "SPRING_PROFILES_ACTIVE=staging" \
              -e "TZ=Asia/Jakarta" \
              -v $(pwd)/uploads:/app/uploads \
              --restart always \
              --cpus=1 \
              --memory=1g \
              kosdev92/jelajahbandung:1.0-staging

            # Clean up dangling images
            docker image prune -f
