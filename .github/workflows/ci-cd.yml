name: CI/CD Jelajah Bandung

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3
      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          java-version: "21"
          distribution: "temurin"
      - name: Build with Maven
        run: mvn clean install -DskipTests

      - name: Build the Docker image
        run: docker build . --file Dockerfile --tag kosdev92/jelajahbandung:1.0-dev

      - name: Push the Docker image
        run: |
          docker login -u ${{ secrets.DOCKERHUB_USERNAME }} -p ${{ secrets.DOCKERHUB_TOKEN }}
          docker push kosdev92/jelajahbandung:1.0-dev

      - name: Deploy to remote server
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            cd ~/jelajahbandung-dev || mkdir -p ~/jelajahbandung-dev && cd ~/jelajahbandung-dev
            docker stop jelajahbandung-dev || true
            docker rm jelajahbandung-dev || true
            docker pull kosdev92/jelajahbandung:1.0-dev
            docker run -dp 8080:8080 --name jelajahbandung-dev --network jc-network -e "SPRING_PROFILES_ACTIVE=dev" -e TZ=Asia/Jakarta -v $(pwd)/uploads:/app/uploads --cpus=1 --memory=1g kosdev92/jelajahbandung:1.0-dev
